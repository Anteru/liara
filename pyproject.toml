[project]
name = "Liara"
dynamic = ["version"]

authors = [
  {name = "Matthäus G. Chajdas", email = "dev@anteru.net" }
]

description = "Liara is a static page generator"
readme = {file = "README.md", content-type = "text/markdown"}
license = "AGPL-3.0-or-later"

keywords = ["static site generator", "static sites", "ssg"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System",
]

requires-python = ">= 3.10"
dependencies = [
  "beautifulsoup4~=4.12",
  "blinker~=1.7",
  "click~=8.5",
  "dateparser~=1.4",
  "humanfriendly~=10.0",
  "Jinja2~=3.1",
  "libsass~=0.21",
  "lxml~=6.0",
  "Mako~=1.4",
  "Markdown~=3.5",
  "MarkupSafe>=2.0",
  "Pillow~=13.0; python_version >= '3.11'",
  "Pillow~=12.0; python_version < '3.11'",
  "Pygments~=2.21",
  "pymdown-extensions~=10.0",
  "python-slugify~=9.0",
  "PyYAML~=6.0",
  "requests~=2.31",
  "tomli~=2.0; python_version < '3.11'",
  "tzlocal~=5.2",
  "watchfiles~=1.3",
]

[project.optional-dependencies]

redis = [
  "redis~=5.0",
]

compression = [
  "zstd~=1.5.7.2",
  "brotli~=1.2.0"
]

[dependency-groups]
dev = [
  "flake8",
  "tox",
]

docs = [
  "Sphinx~=9.0; python_version >= '3.11'",
  "Sphinx~=8.1; python_version < '3.11'",
  "furo",
  "sphinx-autodoc2"
]

[project.urls]
Homepage = "https://liara.sh13.net"
"Issue Tracker" = "https://github.com/anteru/liara/issues"
Repository = "https://github.com/anteru/liara"
Documentation = "https://liara-web.readthedocs.io"

[project.scripts]
liara = "liara.cmdline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.tox]
legacy_tox_ini = """
[testenv]
deps = 
  pytest
commands =
   pytest
"""

[tool.hatch.version]
path = "liara/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["liara"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"